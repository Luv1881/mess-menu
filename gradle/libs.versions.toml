espressoCore = "3.5.1"
appcompat = "1.6.1"
material = "1.11.0"
activity = "1.8.2"
fragment = "1.6.2"
lifecycle = "2.7.0"
workmanager = "2.9.0"
datastore = "1.0.0"
gson = "2.10.1"
poi = "5.2.5"
constraintlayout = "2.1.4"
recyclerview = "1.3.2"
swiperefreshlayout = "1.1.0"
cardview = "1.0.0"
